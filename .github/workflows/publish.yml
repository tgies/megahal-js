name: Publish Package to npm

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed for creating GitHub releases
      id-token: write  # needed for npm provenance and OIDC trusted publishers
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches tag
        id: version-check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::Git tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          echo "Version verified: $VERSION"

      - name: Run quality check
        run: npm run check

      - name: Build type declarations
        run: npm run build:types

      - name: Validate package exports
        run: npx publint

      - name: Validate TypeScript declarations
        run: npx @arethetypeswrong/cli --pack . --profile esm-only

      - name: Security audit
        run: npm audit --audit-level=moderate --omit=dev

      - name: Determine dist tag
        id: dist-tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            TAG=${VERSION#*-}
            TAG=${TAG%%.*}
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            TAG="latest"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Publishing $VERSION with dist tag: $TAG"

      - name: Publish to npm
        run: npm publish --provenance --access public --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.dist-tag.outputs.prerelease }}
        run: |
          git fetch --tags --force
          TAG_MSG=$(git tag -l --format='%(contents)' "$REF_NAME")
          PRERELEASE_FLAG=()
          if [[ "$PRERELEASE" == "true" ]]; then
            PRERELEASE_FLAG=(--prerelease)
          fi
          gh release create "$REF_NAME" \
            --title "$REF_NAME" \
            --notes "$TAG_MSG" \
            --generate-notes \
            "${PRERELEASE_FLAG[@]}"
